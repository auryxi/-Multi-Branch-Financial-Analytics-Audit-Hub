<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Profitability</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Shared System Layout -->
    <link rel="stylesheet" href="/assets/css/style.css">

    <!-- Analytics Styles -->
    <link rel="stylesheet" href="/assets/analytics.css">
</head>

<body data-page-header="Branch Profitability">

    <!-- Topbar -->
    <div id="topbar-wrapper"></div>

    <!-- Layout Container -->
    <div class="app-container">

        <!-- Sidebar -->
        <div id="sidebar-wrapper"></div>

        <!-- Main Content -->
        <main class="main-content">

            <div class="container-fluid py-4">

                <!-- Header -->
                <section class="dashboard-header">

                    <p>
                        Comparing revenue, expenses and margins across branches
                    </p>

                    <div class="filters">
                        <input type="date">

                        <select>
                            <option>All Branches</option>
                            <option>Balagtas</option>
                            <option>Borol</option>
                            <option>Bullihan Centro</option>
                            <option>Pandi</option>
                            <option>Northville 6</option>
                            <option>Santol</option>
                            <option>Pulong Gubat</option>
                        </select>
                    </div>

                </section>

                <!-- KPI Cards -->
                <section class="cards">

                    <div class="card">
                        <h3>HIGHEST PERFORMING</h3>
                        <div class="card-value" id="highest">
                            Balagtas
                        </div>
                    </div>

                    <div class="card">
                        <h3>LOWEST PERFORMING</h3>
                        <div class="card-value" id="lowest">
                            Santol
                        </div>
                    </div>

                    <div class="card">
                        <h3>AVERAGE PROFIT MARGIN</h3>
                        <div class="card-value" id="averageMargin">
                            30%
                        </div>
                    </div>

                    <div class="card">
                        <h3>TOTAL ACTIVE BRANCHES</h3>
                        <div class="card-value" id="branches">
                            7
                        </div>
                    </div>

                </section>

                <!-- Charts -->
                <section class="charts">

                    <div class="chart-box profitability-chart">
                        <h2>Branch Revenue Comparison</h2>
                        <canvas id="branchRevenueChart"></canvas>
                    </div>

                    <div class="chart-box profitability-chart">
                        <h2>Profit Margin Ranking</h2>
                        <canvas id="marginChart"></canvas>
                    </div>

                </section>

                <!-- Summary Table -->
                <section class="summary">

                    <h2>Branch Performance Detail</h2>

                    <table class="branch-table">

                        <thead>
                            <tr>
                                <th>Branch</th>
                                <th>Revenue</th>
                                <th>Expenses</th>
                                <th>Profit Margin</th>
                                <th>Rank</th>
                            </tr>
                        </thead>

                        <tbody id="branchPerformanceBody">
                        </tbody>

                    </table>

                </section>

            </div>

        </main>

    </div>

    <!-- Shared Layout Script -->
    <script src="/js/shared/bars.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Page Script -->
    <script src="/js/branch-profitability.js"></script>

</body>

</html>
